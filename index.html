  <style>
    :root { --side:#14120f; --gold:#d7b56a; --paper:#f3efe6; --ink:#1b1914; --muted:#655f55; --line:#e4dccf; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Outfit,sans-serif; }
    button { font:inherit; color:inherit; }
    a { color:#8a5a12; }
    .app { display:grid; grid-template-columns:270px 1fr; min-height:100vh; }
    aside { background:var(--side); color:#f6f1e6; padding:26px 20px; }

    .tag { color:var(--gold); letter-spacing:.16em; font-size:12px; font-weight:700; }
    aside nav { display:grid; gap:4px; margin-bottom:18px; }
    aside button, aside a { display:block; width:100%; text-align:left; background:none; border:0; color:#f6f1e6; text-decoration:none; font-weight:600; padding:8px 0; cursor:pointer; }
    aside button[aria-pressed="true"] { color:var(--gold); }
    main { padding:26px 28px 48px; }
    .layout { display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start; }
    .files { display:grid; gap:6px; max-height:calc(100dvh - 80px); overflow:auto; }
    .files button { text-align:left; border:0; background:#fff; border-radius:12px; padding:10px 12px; cursor:pointer; }
    .files small { display:block; color:var(--muted); }
    .files button[aria-pressed="true"] { outline:2px solid var(--gold); }
    .file { background:#fffdf8; border:1px solid var(--line); border-radius:18px; padding:22px 22px 28px; box-shadow:0 18px 40px rgba(20,18,15,.05); }
    .filehead { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .no { letter-spacing:.14em; font-size:12px; color:var(--muted); font-weight:700; }
    h2, h3 { font-family:Newsreader,serif; font-weight:450; }
    .file h2 { font-size:clamp(32px, 4vw, 46px); margin:4px 0 8px; line-height:1; }
    .stamp { border:2px solid #8d2f2f; color:#8d2f2f; letter-spacing:.14em; font-weight:700; font-size:12px; padding:8px 10px; transform:rotate(-8deg); }
    .stamp.pub { border-color:#1d6a42; color:#1d6a42; }
    .file section { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
    .file ol { margin:8px 0 0; padding-left:18px; }
    .stack { display:flex; flex-wrap:wrap; gap:6px; }
    .stack span, .tools span { background:var(--paper); border-radius:999px; padding:4px 8px; font-size:13px; }
    .muted { color:var(--muted); }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; }
    .record article { border-top:1px solid var(--line); padding:12px 0; }
    @media (max-width:860px) {
      .app, .layout { grid-template-columns:1fr; }
      aside nav { display:flex; flex-wrap:wrap; gap:10px; }
      .files { max-height:none; }
      main { padding:16px 14px 36px; }

  <script>
    const WORK = JSON.parse(document.getElementById("data").textContent);
    const main = document.getElementById("main");
    let current = "asper";
    let view = "files";
    const fromHash = location.hash.slice(1);
    if (fromHash === "practice" || fromHash === "record") view = fromHash;
    else if (WORK.some(p => p.id === fromHash)) current = fromHash;
    function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function fileHtml(p) {
      const n = String(WORK.findIndex(x => x.id === p.id) + 1).padStart(2, "0");
      const access = p.href ? `<a href="${esc(p.href)}">Repository</a>` : `Private repository.`;
      return `<article class="file"><div class="filehead"><div><div class="no">FILE ${n} · ${esc(p.area.toUpperCase())}</div><h2>${esc(p.name)}</h2><p>${esc(p.brief)}</p><p class="muted">${esc(p.place)}</p></div><div class="stamp ${p.vis==="Public"?"pub":""}">${esc(p.vis.toUpperCase())}</div></div><section><h3>Assembled</h3><ol>${p.parts.map(part => `<li>${esc(part)}</li>`).join("")}</ol></section><section><h3>Stack</h3><div class="stack">${p.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div></section><section><h3>Access</h3><p>${access}</p></section></article>`;
    }
    function filesView() {
      return `<div class="layout"><div class="files">${WORK.map(p => `<button type="button" data-id="${p.id}" aria-pressed="${p.id===current}"><b>${esc(p.name)}</b><small>File ${String(WORK.findIndex(x=>x.id===p.id)+1).padStart(2,"0")} · ${esc(p.vis)}</small></button>`).join("")}</div>${fileHtml(WORK.find(p => p.id === current))}</div>`;
    }
    function practiceView() {
      const tools = ["Python","Flask","PHP","MySQL","TypeScript","Flutter","Docker","Telegram","SQLite","HTML","CSS","Web"];
      const rows = tools.map(tool => {
        const hits = WORK.filter(p => p.stack.some(s => s.toLowerCase() === tool.toLowerCase()));
        return hits.length ? `<tr><th>${tool}</th><td>${hits.map(p => esc(p.name)).join(", ")}</td><td>${hits.length}</td></tr>` : "";
      }).join("");
      return `<h2>Practice map</h2><p class="muted">Each tool is listed with the systems that use it. Counts come from this record.</p><table><thead><tr><th>Tool</th><th>Systems</th><th></th></tr></thead><tbody>${rows}</tbody></table><h3>Security workbench</h3><p>Project ASPER with Tata Elxsi. Phishing detection, image checks, firewall baselines, Falco runtime detection, PAN-OS, Mininet, and Ansible. Incident-response workshop at SETS, Chennai.</p>`;
    }
    function recordView() {
      return `<h2>Record</h2><div class="record"><article><b>Software Developer · Digital University Kerala</b><p class="muted">March 2025 – Present, Technopark. Development team, Network and Systems Security Lab.</p></article><article><b>Freelance Developer · Kottayam</b><p class="muted">February 2024 – Present. Products for shops, stations, colleges, and security use.</p></article><article><b>Python Developer · MGU Innovation Foundation</b><p class="muted">June 2024 – September 2024. Backend Python.</p></article><article><b>IT Administrator · MES Golden Jubilee College</b><p class="muted">April 2024 – June 2024.</p></article><article><b>Education</b><p class="muted">BCA, MES Golden Jubilee College, Mahatma Gandhi University, 2021–2024. Higher secondary Computer Science, MGM NSS HSS Lakkattoor, 2019–2021. Kaggle, Introduction to Programming Using Python, April 2024.</p></article></div>`;
    }
    function draw() {
      main.innerHTML = view === "practice" ? practiceView() : view === "record" ? recordView() : filesView();
      document.querySelectorAll("aside button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
      const hash = view === "files" ? current : view;
      if (location.hash !== "#" + hash) history.replaceState(null, "", "#" + hash);
    }
    document.querySelector("aside").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      view = b.dataset.view;
      draw();
    });
    main.addEventListener("click", e => {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      current = b.dataset.id;
      view = "files";
      draw();
    });
    draw();
  </script>
